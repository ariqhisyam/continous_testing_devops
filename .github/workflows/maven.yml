# CI/CD Workflow: Java with Maven + JUnit
# Otomatis berjalan setiap push / pull_request ke branch main

name: continous_testing_devops

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    # 1. Clone repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install JDK 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    # 3. Build project
    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml

    # 4. Run all JUnit tests
    - name: Run Tests with Maven
      run: mvn test

    # 5. Upload test results sebagai artifact
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/

    # 6. Analyze with SonarCloud
    - name: SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        -Dsonar.projectKey=ariqhisyam_continous_testing_devops 
        -Dsonar.organization=ariqhisyam 
        -Dsonar.host.url=https://sonarcloud.io
